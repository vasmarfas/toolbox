name: Deploy Desktop
run-name: Deploy Desktop ${{ inputs.version_name }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App versionName (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Build number (empty = github.run_number)'
        required: false
        default: ''
      build_windows:
        description: 'Windows (MSI, EXE)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (DEB, RPM)'
        type: boolean
        default: true
      build_macos:
        description: 'macOS (DMG, notarized)'
        type: boolean
        default: true
      publish_mac_app_store:
        description: 'Upload the PKG to the Mac App Store (needs appStore = true in desktopApp/build.gradle.kts)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version_name:
        type: string
        required: false
        default: ''
      version_code:
        type: string
        required: false
        default: ''
      build_windows:
        type: boolean
        required: false
        default: true
      build_linux:
        type: boolean
        required: false
        default: true
      build_macos:
        type: boolean
        required: false
        default: true
      publish_mac_app_store:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) name="1.0.0" ;;
            esac
          fi
          {
            echo "name=$name"
            echo "package=${name%%-*}"
            echo "code=${INPUT_CODE:-$RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.package }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :desktopApp:packageMsi :desktopApp:packageExe

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p out
          cp desktopApp/build/compose/binaries/main/msi/*.msi "out/vasmarfas-$VERSION-windows.msi"
          cp desktopApp/build/compose/binaries/main/exe/*.exe "out/vasmarfas-$VERSION-windows-setup.exe"

      - name: Sign installers
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_PFX_BASE64)) {
            Write-Output "::notice::WINDOWS_PFX_BASE64 is not set, installers stay unsigned"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          Get-ChildItem out -Include *.msi, *.exe -Recurse | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($_.Name)" }
          }
          Remove-Item $pfx -Force

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) name="1.0.0" ;;
            esac
          fi
          {
            echo "name=$name"
            echo "package=${name%%-*}"
            echo "code=${INPUT_CODE:-$RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Package
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.package }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p out
          cp desktopApp/build/compose/binaries/main/deb/*.deb "out/vasmarfas-$VERSION-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "out/vasmarfas-$VERSION-linux-x86_64.rpm"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) name="1.0.0" ;;
            esac
          fi
          {
            echo "name=$name"
            echo "package=${name%%-*}"
            echo "code=${INPUT_CODE:-$RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        id: certificate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -eu
          if [ -z "${APPLE_DEVELOPER_ID_P12_BASE64:-}" ]; then
            echo "imported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_DEVELOPER_ID_P12_BASE64 is not set, the DMG stays unsigned and is not notarized"
            exit 0
          fi
          umask 077
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | tr -d '\n\r ' | openssl base64 -d -A > "$RUNNER_TEMP/developer_id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/developer_id.p12"
          echo "imported=true" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Package DMG
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.package }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ steps.certificate.outputs.imported == 'true' && secrets.APPLE_DEVELOPER_ID_IDENTITY || '' }}
        run: ./gradlew :desktopApp:packageDmg

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p out
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg "out/vasmarfas-$VERSION-macos.dmg"

      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNED: ${{ steps.certificate.outputs.imported }}
        run: |
          set -eu
          if [ "$SIGNED" != 'true' ] || [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_P8:-}" ]; then
            echo "::notice::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 are not set or the build is unsigned, skipping notarization"
            echo 'macOS: DMG is not notarized.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/asc_key.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '\n\r ' | openssl base64 -d -A > "$key"
          fi
          for dmg in out/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
            xcrun stapler staple "$dmg"
          done
          rm -f "$key"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: out/*
          if-no-files-found: error

      - name: Upload to the Mac App Store
        if: ${{ inputs.publish_mac_app_store }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_VERSION_NAME: ${{ steps.version.outputs.package }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.MAC_APP_STORE_IDENTITY }}
        run: |
          set -eu
          if [ -z "${APPLE_DEVELOPER_ID_IDENTITY:-}" ] || [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_P8:-}" ]; then
            echo "::notice::MAC_APP_STORE_IDENTITY or the ASC_* secrets are not set, skipping the Mac App Store"
            echo 'Mac App Store: skipped, secrets are not set.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::the PKG is accepted by the Mac App Store only when desktopApp/build.gradle.kts sets macOS { appStore = true } together with the sandbox entitlements"
          ./gradlew :desktopApp:packagePkg
          umask 077
          key="$RUNNER_TEMP/asc_key.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '\n\r ' | openssl base64 -d -A > "$key"
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$key" ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          for pkg in desktopApp/build/compose/binaries/main/pkg/*.pkg; do
            xcrun altool --upload-app -f "$pkg" -t macos --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          done
          rm -f "$key" ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Remove the temporary keychain
        if: always() && steps.certificate.outputs.imported == 'true'
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
